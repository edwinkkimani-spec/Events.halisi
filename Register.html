<div id="registerModal" class="modal-overlay" style="display: none;">
  <div class="modal-box">
    <button id="closeModalBtn" class="modal-close" aria-label="Close">&times;</button>
    <h3>Register for <span id="modalEventTitle"></span></h3>
    <form id="registerForm">
      <label for="holderName">Full Name</label>
      <input type="text" id="holderName" required placeholder="Your full name" />

      <label for="holderEmail">Email</label>
      <input type="email" id="holderEmail" required placeholder="you@example.com" />

      <button type="submit" class="btn btn-primary" style="margin-top: 16px;">
        Confirm & Get Pass
      </button>
    </form>
  </div>
</div>
