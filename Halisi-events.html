<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>T-Smart | Browse Events</title>
    
    <link rel="stylesheet" href="styles.css" />
    
  
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="skiddle.css"/>
</head>
<body>

    <header class="site-header">
        <img src="Images/logo.jpg" alt="T-Smart Logo Left" class="header-img header-img-left" />
        <h1 class="header-title">T-Smart</h1>
        <img src="Images/logo.jpg" alt="T-Smart Logo Right" class="header-img header-img-right" />
    </header>

  
    <div class="layout">
        
      
        <nav class="sidebar">
            <a href="index.html"><i class="fa-solid fa-house"></i> Home</a>
            <a href="Halisi-events.html" class="active"><i class="fa-solid fa-calendar-days"></i> Browse Events</a>
            <a href="qrcode.html"><i class="fa-solid fa-qrcode"></i> Scan Pass</a>
        </nav>
        
      
        <main class="content-body">
            
        
            <section class="hero-section">
                <div class="hero-badge"><i class="fa-solid fa-ticket"></i> Live Listings</div>
                <h2 class="hero-title">All Events</h2>
                <p class="hero-subtitle">Browse what's happening around you and cop your smart ticket instantly.</p>
            </section>

            
            <section class="events-section">
                <!-- Search & Filter Controls -->
                <div class="search-container">
                    <i class="fa-solid fa-magnifying-glass search-icon"></i>
                    <input 
                        type="text" 
                        id="event-search" 
                        class="search-input" 
                        placeholder="Search events, venues, or categories..." 
                    />
                </div>

                <div id="event-list" class="event-grid"></div>
            </section>

        </main>
    </div>


    <footer class="footer">
        <div class="footer-socials">
            <a href="https://www.instagram.com/" target="_blank">
                <i class="fa-brands fa-instagram"></i> Instagram
            </a>
            <a href="https://www.tiktok.com/" target="_blank">
                <i class="fa-brands fa-tiktok"></i> TikTok
            </a>
        </div>
        <p class="footer-brand">T-Smart</p>
        <p>&copy; 2026 T-Smart. All rights reserved.</p>
    </footer>
       
    <div id="registerModal" class="modal-overlay">
  <div class="modal-box">
    <button id="closeModalBtn" class="modal-close" aria-label="Close">&times;</button>
    <h3>Register for <span id="modalEventTitle"></span></h3>
    <form id="registerForm">
      <label for="holderName">Full Name</label>
      <input type="text" id="holderName" required placeholder="Your full name" />

      <label for="holderEmail">Email</label>
      <input type="email" id="holderEmail" required placeholder="you@example.com" />
      <label for="holderPhone">Mpesa Phone Number</label>
      <input type="tel" id="holderPhone" required placeholder="07xxxxxxxxxx" pattern="0[71][0-9]{8}"/>

      <button type="submit" class="btn btn-primary" style="margin-top: 16px;">
        Confirm & Get Pass
      </button>
    </form>
  </div>
</div>

    <script src="script.js"></script>

</body>
</html>
